<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4TEL · ULTRA · FULLSYNC · GEO-PHYSIK · iki1uc</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --gold: #ffd700;
    --l1: #ff6b6b;
    --l2: #6bff6b;
    --l3: #6b6bff;
    --l4: #ffd93d;
    --l5: #ff44ff;
    --l6: #6cf;
    --l7: #ff8c00;
    --err: #ff3333;
    --warn: #ffaa00;
    --ok: #44ff44;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 4px;
    padding: 8px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 4px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 2px;
}
header h1 .tel4 { color: var(--l4); }
header h1 .sync { color: var(--l2); }
header h1 .geo { color: var(--l1); }
#info-bar { font-size: 8px; color: #666; display: flex; gap: 6px; align-items: center; }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 4px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 4px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    display: block;
}
#canvas-overlay {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 7px;
    color: #444;
    pointer-events: none;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 3px;
}
#canvas-overlay .ok { color: var(--ok); }
#canvas-overlay .err { color: var(--err); }

#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    max-height: 100%;
    font-size: 8px;
}
#panel h3 { font-size: 8px; color: #666; border-bottom: 1px solid #1a1a2a; padding-bottom: 2px; }

#log {
    flex: 1;
    overflow-y: auto;
    font-size: 7px;
    color: #6a6a8a;
    line-height: 1.2;
    min-height: 30px;
    max-height: 60px;
    background: #06060a;
    border-radius: 3px;
    padding: 2px 4px;
}
#log .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.ok { color: var(--ok); }
#log .msg.err { color: var(--err); }
#log .msg.warn { color: var(--warn); }
#log .msg.tel4 { color: var(--l4); }

#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 2px;
}
.metric {
    background: #0e0e1a;
    border-radius: 3px;
    padding: 2px 3px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 5px; text-transform: uppercase; }
.metric .value { font-size: 9px; font-weight: bold; }
.metric.tel4 .value { color: var(--l4); }
.metric.sync .value { color: var(--l2); }
.metric.geo .value { color: var(--l1); }
.metric.phys .value { color: var(--l3); }

#controls {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 2px 6px;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: 7px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: var(--gold); color: #000; }
button.tel4 { border-color: var(--l4); color: var(--l4); }
button.tel4:hover { background: var(--l4); color: #000; }
button.danger { border-color: var(--err); color: var(--err); }
button.danger:hover { background: var(--err); color: #000; }

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 180px; }
}
</style>
</head>

<body>

<header>
    <h1>
        <span class="tel4">◈ 4TEL</span>
        <span style="color:#666;">·</span>
        <span class="sync">⟳ FULLSYNC</span>
        <span style="color:#666;">·</span>
        <span class="geo">⚡ GEO</span>
        <span style="color:#666;">·</span>
        <span style="color:var(--gold);">PHYSIK</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <span id="cycle-display" style="color:#666;">4TEL 0</span>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="telCanvas"></canvas>
        <div id="canvas-overlay">
            <span class="ok">●</span> 4TEL · <span class="err">●</span> FullSync · <span class="ok">●</span> GEO-PHYSIK
        </div>
    </div>

    <div id="panel">
        <h3>📐 4TEL · FULLSYNC · GEO-PHYSIK</h3>

        <div id="metrics">
            <div class="metric tel4"><div class="label">4TEL</div><div class="value" id="tel4-value">◈</div></div>
            <div class="metric sync"><div class="label">SYNC</div><div class="value" id="sync-value">0%</div></div>
            <div class="metric geo"><div class="label">GEO</div><div class="value" id="geo-value">0</div></div>
            <div class="metric phys"><div class="label">PHYS</div><div class="value" id="phys-value">0</div></div>
        </div>

        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">◈ 4TEL · FULLSYNC · GEO-PHYSIK</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg tel4">3TEL → 4TEL · ◎ Zentralknoten</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">α, β, γ, δ · Energie, Impuls, Feld, Zentrumskraft</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-start">▶ START</button>
            <button class="tel4" id="btn-tel4">◈ 4TEL</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. 4TEL · FULLSYNC · GEO-PHYSIK
// ============================================================

// --- KONSTANTEN ---
const PHI = 1.61803398875;
const PHI_INV = 1 / PHI;

// --- 4TEL-KERN (aus deinem System) ---
const TEL4_CORE = {
    // Segment-Typen
    segments: {
        HY: { tri: ['◉', '3', '9'], quad: ['◉', '3', '9', '◎'] },
        PE: { tri: ['◉', '9', '◎'], quad: ['◉', '9', '◎', '81'] },
        PER: { tri: ['3', '9', '81'], quad: ['3', '9', '81', '◆'] },
        TRANS: { tri: ['◎', '81', '◆'], quad: ['◎', '81', '◆', '△'] },
        WARB: { tri: ['81', '◆', '△'], quad: ['81', '◆', '△', '27'] },
        KANAL: { tri: ['756', '△', '27'], quad: ['756', '△', '27', '▣'] },
        TMP: { tri: ['3', '◎', '27'], quad: ['3', '◎', '27', '▣'] }
    },

    // 3TEL → 4TEL
    fullSync: function(segment) {
        const seg = this.segments[segment] || this.segments.PER;
        return {
            tri: seg.tri,
            quad: seg.quad,
            sync: true
        };
    },

    // GEO-Physik
    geoPhysik: function(quad) {
        // α, β, γ, δ aus 4TEL
        const map = {
            '◉': 1, '3': 3, '9': 9, '◎': 1, '81': 81,
            '◆': 7, '△': 11, '▣': 13, '27': 27, '756': 756
        };
        const alpha = map[quad[0]] || 1;
        const beta = map[quad[1]] || 1;
        const gamma = map[quad[2]] || 1;
        const delta = map[quad[3]] || 1;

        // Physikalische Felder
        const energie = alpha * 9.81;
        const impuls = beta * gamma;
        const feld = gamma * 42;
        const zentrumskraft = delta * 108;

        return { alpha, beta, gamma, delta, energie, impuls, feld, zentrumskraft };
    },

    // VEKTEL-Vektoren
    vektel: function(tri, quad) {
        return {
            v1: tri[0] || '◉',
            v2: quad[quad.length - 1] || '▣',
            v3: (tri[1] || '3') + '→' + (quad[2] || '81')
        };
    }
};

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('telCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. STATE
// ============================================================
const state = {
    running: false,
    paused: false,
    autoMode: false,
    cycle: 0,
    t: 0,

    // 4TEL
    segment: 'PER',
    tri: ['3', '9', '81'],
    quad: ['3', '9', '81', '◆'],
    sync: true,

    // GEO-Physik
    geo: { alpha: 3, beta: 9, gamma: 81, delta: 7 },
    phys: { energie: 29.43, impuls: 729, feld: 3402, zentrumskraft: 756 },

    // VEKTEL
    vektel: { v1: '3', v2: '◆', v3: '9→81' },

    // SYN/QUANT/RESPO
    syn: 0.5,
    quant: 0.5,
    respo: 0.5
};

// ============================================================
// 4. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : type === 'warn' ? 'warn' :
                type === 'tel4' ? 'tel4' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 5. 4TEL · KERN
// ============================================================

function updateTel4(segment) {
    const seg = TEL4_CORE.fullSync(segment);
    state.tri = seg.tri;
    state.quad = seg.quad;
    state.sync = seg.sync;

    // GEO-Physik
    const geo = TEL4_CORE.geoPhysik(state.quad);
    state.geo = geo;
    state.phys = {
        energie: geo.energie,
        impuls: geo.impuls,
        feld: geo.feld,
        zentrumskraft: geo.zentrumskraft
    };

    // VEKTEL
    const vek = TEL4_CORE.vektel(state.tri, state.quad);
    state.vektel = vek;

    // RESPO
    state.respo = computeRespo(state.syn, state.quant);

    // Metriken
    document.getElementById('tel4-value').textContent = state.quad.join(' → ');
    document.getElementById('sync-value').textContent = state.sync ? '100%' : '0%';
    document.getElementById('geo-value').textContent = `${state.geo.alpha}, ${state.geo.beta}, ${state.geo.gamma}, ${state.geo.delta}`;
    document.getElementById('phys-value').textContent = `${state.phys.energie.toFixed(1)}E`;

    log(`◈ 4TEL: ${state.quad.join(' → ')} | α=${state.geo.alpha} β=${state.geo.beta} γ=${state.geo.gamma} δ=${state.geo.delta}`, 'tel4');
}

function computeRespo(syn, quant) {
    return Math.min(1, (syn + quant) / PHI);
}

// ============================================================
// 6. RENDER
// ============================================================
function render() {
    if (state.paused) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 1. 4TEL-Segment anzeigen
    drawTel4();

    // 2. GEO-Physik
    drawGeoPhysik();

    // 3. VEKTEL
    drawVektel();

    // 4. RESPO-Kern
    drawRespo();

    // 5. SYN/QUANT
    drawSynQuant();

    // Update
    state.t += 0.008;
    if (state.running) {
        state.cycle++;
        state.syn = 0.5 + 0.4 * Math.sin(state.t * 0.3);
        state.quant = 0.5 + 0.4 * Math.cos(state.t * 0.25);
        state.respo = computeRespo(state.syn, state.quant);

        // 4TEL wechselt automatisch
        if (state.cycle % 30 === 0) {
            const segments = ['HY', 'PE', 'PER', 'TRANS', 'WARB', 'KANAL', 'TMP'];
            const idx = Math.floor(Math.random() * segments.length);
            updateTel4(segments[idx]);
        }
    }

    if (state.cycle % 15 === 0) {
        document.getElementById('cycle-display').textContent = `4TEL ${state.cycle}`;
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 7. ZEICHEN-FUNKTIONEN
// ============================================================

function drawTel4() {
    const quad = state.quad;
    const n = quad.length;
    const r = radius * 0.35;

    // 4TEL-Kreis
    ctx.strokeStyle = 'rgba(255, 215, 61, 0.05)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 4 Elemente
    const colors = ['#ff6b6b', '#6bff6b', '#6b6bff', '#ffd93d'];
    const symbols = ['◉', '3', '9', '◎'];

    quad.forEach((symbol, i) => {
        const angle = (i / n) * Math.PI * 2 + state.t * 0.05;
        const dist = r * (0.5 + 0.3 * (i / n));
        const x = cx + Math.cos(angle) * dist;
        const y = cy + Math.sin(angle) * dist;

        // Kreis
        ctx.strokeStyle = colors[i % colors.length] + '66';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 14, 0, Math.PI * 2);
        ctx.stroke();

        // Füllung
        ctx.fillStyle = colors[i % colors.length] + '44';
        ctx.shadowColor = colors[i % colors.length];
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Symbol
        ctx.fillStyle = '#fff';
        ctx.font = '12px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(symbol, x, y);

        // Label
        ctx.fillStyle = '#666';
        ctx.font = '4px Consolas';
        ctx.textBaseline = 'top';
        const labels = ['α', 'β', 'γ', 'δ'];
        ctx.fillText(labels[i], x, y + 16);
    });

    // Zentrum (◎)
    ctx.fillStyle = 'rgba(255, 215, 61, 0.1)';
    ctx.font = '24px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◎', cx, cy);
}

function drawGeoPhysik() {
    const geo = state.geo;
    const phys = state.phys;
    const r = radius * 0.55;

    // GEO-Werte
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(8, 8, 140, 50);

    ctx.fillStyle = '#ff6b6b66';
    ctx.font = '5px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`GEO: α=${geo.alpha} β=${geo.beta} γ=${geo.gamma} δ=${geo.delta}`, 12, 10);

    ctx.fillStyle = '#6b6bff66';
    ctx.fillText(`PHYS: E=${phys.energie.toFixed(1)} I=${phys.impuls.toFixed(1)} F=${phys.feld.toFixed(1)} Z=${phys.zentrumskraft.toFixed(1)}`, 12, 24);

    // Energie-Balken
    const maxE = 8000;
    const pct = Math.min(1, phys.energie / maxE);
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(12, 40, 100, 4);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(12, 40, 100 * pct, 4);
}

function drawVektel() {
    const v = state.vektel;
    const r = radius * 0.15;

    // VEKTEL-Anzeige
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(W - 100, 8, 92, 30);

    ctx.fillStyle = '#ffd93d66';
    ctx.font = '4px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`V1: ${v.v1}`, W - 96, 10);
    ctx.fillStyle = '#6bff6b66';
    ctx.fillText(`V2: ${v.v2}`, W - 96, 20);
    ctx.fillStyle = '#6b6bff66';
    ctx.fillText(`V3: ${v.v3}`, W - 96, 30);
}

function drawRespo() {
    const val = state.respo;
    const coreRadius = 3 + val * 10;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 10);
    glow.addColorStop(0, `rgba(108, 204, 255, ${0.1 + val * 0.2})`);
    glow.addColorStop(1, 'rgba(108, 204, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 10, 0, Math.PI * 2);
    ctx.fill();

    const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(108, 204, 255, ${0.4 + val * 0.4})`);
    coreGrad.addColorStop(0.7, `rgba(60, 180, 220, ${0.2 + val * 0.3})`);
    coreGrad.addColorStop(1, `rgba(40, 120, 180, ${0.1 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 6 + val * 10;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.font = `bold ${4 + val * 4}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', cx, cy);

    ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + val * 0.2})`;
    ctx.font = '4px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(`φ = ${state.respo.toFixed(3)}`, cx, cy + coreRadius + 4);
}

function drawSynQuant() {
    const syn = state.syn;
    const quant = state.quant;
    const r = radius * 0.06;

    const sx = cx - r * 0.6;
    const sy = cy + r * 0.15;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.1 + syn * 0.2})`;
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 2 + syn * 4;
    ctx.beginPath();
    ctx.arc(sx, sy, 1 + syn * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.1 + syn * 0.2})`;
    ctx.font = '3px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`SYN ${(syn * 100).toFixed(0)}%`, sx, sy - 6);

    const qx = cx + r * 0.6;
    const qy = cy + r * 0.15;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.1 + quant * 0.2})`;
    ctx.shadowColor = '#6b6bff';
    ctx.shadowBlur = 2 + quant * 4;
    ctx.beginPath();
    ctx.arc(qx, qy, 1 + quant * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.1 + quant * 0.2})`;
    ctx.fillText(`QUANT ${(quant * 100).toFixed(0)}%`, qx, qy - 6);
}

// ============================================================
// 8. CONTROLS
// ============================================================
document.getElementById('btn-start').addEventListener('click', function() {
    state.running = !state.running;
    this.textContent = state.running ? '⏸ STOP' : '▶ START';
    document.getElementById('state-display').textContent = state.running ? '● läuft' : '● gestoppt';
    document.getElementById('state-display').style.color = state.running ? 'var(--gold)' : '#666';
    log(state.running ? '▶ 4TEL gestartet' : '⏸ 4TEL gestoppt', 'ok');
});

document.getElementById('btn-tel4').addEventListener('click', function() {
    const segments = ['HY', 'PE', 'PER', 'TRANS', 'WARB', 'KANAL', 'TMP'];
    const idx = Math.floor(Math.random() * segments.length);
    updateTel4(segments[idx]);
    log(`◈ 4TEL gewechselt: ${state.quad.join(' → ')}`, 'tel4');
});

document.getElementById('btn-reset').addEventListener('click', function() {
    state.running = false;
    state.paused = false;
    state.cycle = 0;
    state.t = 0;
    state.syn = 0.5;
    state.quant = 0.5;
    state.respo = 0.5;
    updateTel4('PER');
    document.getElementById('btn-start').textContent = '▶ START';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = '4TEL 0';
    log('⟲ RESET — 4TEL zurückgesetzt', 'ok');
});

document.getElementById('btn-auto').addEventListener('click', function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        log('▶ AUTO · 4TEL wechselt', 'ok');
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(function() {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `4TEL ${state.cycle}`;
            const segments = ['HY', 'PE', 'PER', 'TRANS', 'WARB', 'KANAL', 'TMP'];
            const idx = Math.floor(Math.random() * segments.length);
            updateTel4(segments[idx]);
            log(`🔄 Zyklus ${state.cycle}: ${state.quad.join(' → ')}`, 'tel4');
        }, 4000);
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO pausiert', 'ok');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

// 9. TASTATUR
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === 't' || e.key === 'T') document.getElementById('btn-tel4').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btn-reset').click();
    if (e.key === 'a' || e.key === 'A') document.getElementById('btn-auto').click();
});

// 10. UHR
// ============================================================
function updateClock() {
    document.getElementById('clock').textContent = '⏱️ ' + new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();
